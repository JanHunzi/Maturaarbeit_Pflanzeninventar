<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflanzeninventar Suche</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 1rem; line-height: 1.5; box-sizing: border-box; }
    .container { width: min(100%, 1400px); margin: 0 auto; }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    h1 { margin: 0; }
    .edit-entry-button {
      width: 4rem;
      min-width: 4rem;
      height: 4rem;
      padding: 0.65rem;
      border: 2px solid #111;
      border-radius: 1rem;
      background: #fff;
      color: #111;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .edit-entry-button:hover {
      background: #f5f5f5;
    }
    .edit-entry-button svg {
      width: 2rem;
      height: 2rem;
      stroke: currentColor;
    }
    .toolbar { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 1rem; }
    .toolbar label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .page-actions { display: flex; gap: 0.75rem; margin: 0.75rem 0 1rem; flex-wrap: wrap; }
    .page-actions button { flex: 1 1 220px; }
    .page-actions .secondary-action {
      background: #fff;
      color: #2d3a4a;
      border: 1px solid #bcc6d1;
    }
    .page-actions .secondary-action:hover {
      background: #f5f8fb;
      border-color: #a7b4c2;
    }
    .autocomplete-wrapper { position: relative; }
    .suggestions { position: absolute; top: calc(100% + 0.25rem); left: 0; right: 0; background: #fff; border: 1px solid #bbb; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-height: 240px; overflow-y: auto; z-index: 10; display: none; }
    .toolbar .toolbar-reset {
      background: #fff;
      color: #2d3a4a;
      border: 1px solid #bbb;
    }
    .toolbar .toolbar-reset:hover {
      background: #f7f9fc;
    }
    select[multiple] { height: auto; }
    select[multiple][size="1"] { height: auto; }
    select[multiple].compact { min-height: 2.7rem; }
    .suggestion-item { padding: 0.5rem 0.7rem; cursor: pointer; }
    .suggestion-item:hover { background: #f4f7fb; }
    .image-cell { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .image-cell img { max-width: 220px; max-height: 160px; width: auto; height: auto; object-fit: contain; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .image-cell button { width: auto; padding: 0.45rem 0.75rem; border-radius: 5px; border: 1px solid #bbb; background: #fff; color: #333; cursor: pointer; }
    .image-cell button:hover { background: #f7f9fc; }
    select, input[type=text], button { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid #bbb; border-radius: 5px; box-sizing: border-box; }
    button { cursor: pointer; background: #2a7ae2; color: #fff; border: none; transition: background 0.2s ease; }
    button:hover { background: #1c61c3; }
    .table-scroll { width: 100%; overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; min-width: max-content; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 0.55rem; text-align: left; }
    th { background: #f4f4f4; }
    .footer { margin-top: 1rem; color: #555; }
    .spinner { display: inline-block; margin-left: 0.5rem; }
    .error { color: #b00; }
    .image-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    .image-modal-content {
      width: min(100%, 960px);
      max-height: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      padding: 1rem;
    }
    .image-modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 2rem;
      height: 2rem;
      border: none;
      background: #222;
      color: #fff;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }
    .image-modal-title {
      margin-bottom: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .image-modal-gallery {
      display: grid;
      gap: 0.75rem;
    }
    .image-modal-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .plant-modal-form {
      display: grid;
      gap: 0.9rem;
    }
    .plant-modal-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .plant-modal-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .plant-modal-months {
      display: grid;
      gap: 0.4rem;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    }
    .plant-modal-months label,
    .plant-modal-photos label {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      font-weight: 400;
      margin-bottom: 0;
    }
    .plant-modal-photos {
      display: grid;
      gap: 0.5rem;
    }
    .plant-modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .plant-modal-actions .danger {
      background: #c62828;
      color: #fff;
    }
    .plant-modal-actions .danger:hover {
      background: #a61d1d;
    }
    .management-popup-actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .management-popup-actions button {
      background: #fff;
      color: #222;
      border: 1px solid #c6ced8;
    }
    .management-popup-actions button:hover {
      background: #f5f8fb;
    }
    @media (max-width: 900px) {
      body { padding: 0.75rem; }
      .page-header { align-items: center; }
      .toolbar { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .page-actions { flex-direction: column; }
      .page-actions button { flex: 1 1 auto; }
      th, td { padding: 0.45rem; }
      .image-cell img { max-width: 180px; max-height: 130px; }
    }
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      .page-header { align-items: flex-start; }
      h1 { font-size: 1.4rem; }
      .edit-entry-button {
        width: 3.5rem;
        min-width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.9rem;
      }
      .toolbar { grid-template-columns: 1fr; }
      .image-cell { gap: 0.25rem; }
      .image-modal-content { padding: 0.85rem; }
      .plant-modal-grid { grid-template-columns: 1fr; }
      .plant-modal-months { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Pflanzeninventar</h1>
      <button id="editEntryButton" class="edit-entry-button" type="button" aria-label="Bearbeiten" title="Bearbeiten">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20h4l10.5-10.5a2.121 2.121 0 0 0-3-3L5 17v3z"></path>
          <path d="M13.5 6.5l4 4"></path>
          <path d="M4 4h7"></path>
          <path d="M4 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
        </svg>
      </button>
    </div>

      <div class="toolbar">
        <div>
          <label for="field-name-de">Name Deutsch</label>
          <div class="autocomplete-wrapper">
            <input id="field-name-de" type="text" placeholder="Name Deutsch suchen" autocomplete="off" />
            <div id="field-name-de-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-name-latin">Name Latein</label>
          <div class="autocomplete-wrapper">
            <input id="field-name-latin" type="text" placeholder="Name Latein suchen" autocomplete="off" />
            <div id="field-name-latin-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-family">Pflanzenfamilie</label>
          <div class="autocomplete-wrapper">
            <input id="field-family" type="text" placeholder="Pflanzenfamilie suchen" autocomplete="off" />
            <div id="field-family-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-growth">Wuchsform</label>
          <select id="field-growth"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-color">Blütenfarbe</label>
          <select id="field-color"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-planted">Gepflanzt</label>
          <select id="field-planted"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-month">Blütenmonate</label>
          <select id="field-month" multiple size="1">
            <option value="all">Alle Monate</option>
            <option>Jan</option>
            <option>Feb</option>
            <option>Mar</option>
            <option>Apr</option>
            <option>Mai</option>
            <option>Jun</option>
            <option>Jul</option>
            <option>Aug</option>
            <option>Sep</option>
            <option>Okt</option>
            <option>Nov</option>
            <option>Dez</option>
          </select>
        </div>
        <div>
          <label for="resetButton">Suche</label>
          <button id="resetButton" class="toolbar-reset" type="button">Suche zurücksetzen</button>
        </div>
      </div>

    <div class="footer" id="status">Lade Daten...</div>

    <div id="result"></div>
  </div>

  <script>
    const CSV_FILE = 'Pflanzenliste_Maturaarbeit_DBV2.0_cvs.csv';
    const AUTOCOMPLETE_FIELD_MAP = {
      'field-name-de': 'Name Deutsch',
      'field-name-latin': 'Name Latein',
      'field-family': 'Pflanzenfamilie'
    };
    const SELECT_FIELD_MAP = {
      'field-growth': 'Wuchsform',
      'field-color': 'Blütenfarbe',
      'field-planted': 'Gepflanzt'
    };
    const FIELD_MAP = { ...AUTOCOMPLETE_FIELD_MAP, ...SELECT_FIELD_MAP };
    const MONTH_FIELDS = ['Jan','Feb','Mar','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const IMAGE_BASE_PATH = 'images';
    const IMAGE_INDEX_FILE = 'images/image_index.json';
    const IMAGE_EXTENSIONS = ['webp', 'jpg', 'jpeg', 'png'];
    const MAX_IMAGE_VARIANTS = 30;
    const EDIT_PASSWORD = 'JanHunziker';
    const MANUAL_PLANTS_STORAGE_KEY = 'pflanzeninventar_manual_plants';
    const DELETED_PLANTS_STORAGE_KEY = 'pflanzeninventar_deleted_plants';
    const MANUAL_ROW_FIELDS = ['ID', 'Name Deutsch', 'Name Latein', 'Pflanzenfamilie', 'Wuchsform', 'Blütenfarbe', 'Gepflanzt', ...MONTH_FIELDS];
    const EDITABLE_FIELDS = ['Name Deutsch', 'Name Latein', 'Pflanzenfamilie', 'Wuchsform', 'Blütenfarbe', 'Gepflanzt'];
    let rows = [];
    let baseRows = [];
    let fieldNames = [];
    let fieldSuggestionValues = {
      'field-name-de': [],
      'field-name-latin': [],
      'field-family': []
    };
    let imageIndex = {};
    let manualPlants = [];
    let deletedPlantIds = [];

    function getImageFilesForId(id) {
      const key = String(Number(id));
      const files = imageIndex[key] || [];
      return files.map(name => `${IMAGE_BASE_PATH}/${name}`);
    }

    function safeJsonParse(value, fallback) {
      try {
        return JSON.parse(value);
      } catch (error) {
        return fallback;
      }
    }

    function getNextPlantId(sourceRows) {
      const ids = sourceRows
        .map(row => Number.parseInt(row.ID, 10))
        .filter(number => Number.isFinite(number));
      const nextId = ids.length ? Math.max(...ids) + 1 : 1;
      return String(nextId);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error(`Datei konnte nicht gelesen werden: ${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    function normalizeManualPlant(entry) {
      if (!entry || typeof entry !== 'object') return null;
      const row = {};
      MANUAL_ROW_FIELDS.forEach(field => {
        row[field] = String(entry[field] ?? '').trim();
      });
      row.ID = String(entry.ID ?? '').trim();
      MONTH_FIELDS.forEach(month => {
        row[month] = String(entry[month] ?? '0').trim() === '1' ? '1' : '0';
      });
      row.__photos = Array.isArray(entry.__photos)
        ? entry.__photos.map(photo => ({
            name: String(photo?.name || '').trim(),
            src: String(photo?.src || '').trim()
          })).filter(photo => photo.src)
        : [];
      return row;
    }

    function mergeRows(baseRows, overrides) {
      const overrideMap = new Map();
      overrides.forEach(row => {
        if (row && row.ID) {
          overrideMap.set(String(row.ID), row);
        }
      });

      const merged = baseRows.map(row => {
        const override = overrideMap.get(String(row.ID));
        if (!override) return row;
        return {
          ...row,
          ...override,
          __photos: Array.isArray(override.__photos) ? override.__photos : (Array.isArray(row.__photos) ? row.__photos : [])
        };
      });

      overrides.forEach(row => {
        if (!row || !row.ID) return;
        const existing = baseRows.some(baseRow => String(baseRow.ID) === String(row.ID));
        if (!existing) merged.push(row);
      });

      return merged;
    }

    function loadDeletedPlantIds() {
      const stored = safeJsonParse(localStorage.getItem(DELETED_PLANTS_STORAGE_KEY) || '[]', []);
      if (!Array.isArray(stored)) return [];
      return stored.map(id => String(id || '').trim()).filter(Boolean);
    }

    function loadManualPlants() {
      const stored = safeJsonParse(localStorage.getItem(MANUAL_PLANTS_STORAGE_KEY) || '[]', []);
      if (!Array.isArray(stored)) return [];
      return stored.map(normalizeManualPlant).filter(Boolean);
    }

    function saveManualPlants() {
      localStorage.setItem(MANUAL_PLANTS_STORAGE_KEY, JSON.stringify(manualPlants));
    }

    function saveDeletedPlantIds() {
      localStorage.setItem(DELETED_PLANTS_STORAGE_KEY, JSON.stringify(deletedPlantIds));
    }

    function isDeletedPlantId(id) {
      return deletedPlantIds.includes(String(id || '').trim());
    }

    function refreshRows() {
      rows = mergeRows(baseRows, manualPlants).filter(row => !isDeletedPlantId(row.ID));
    }

    function getRowImageSources(row) {
      const uploadedSources = Array.isArray(row.__photos)
        ? row.__photos.map(photo => photo.src).filter(Boolean)
        : [];
      const indexedSources = row.ID ? getImageFilesForId(row.ID) : [];
      const idSources = row.ID ? getImageCandidates(row.ID, 'original') : [];
      return Array.from(new Set([...uploadedSources, ...indexedSources, ...idSources]));
    }

    function deletePlantById(id) {
      const normalizedId = String(id || '').trim();
      if (!normalizedId) return;
      manualPlants = manualPlants.filter(row => String(row.ID) !== normalizedId);
      if (!deletedPlantIds.includes(normalizedId)) {
        deletedPlantIds.push(normalizedId);
      }
      saveManualPlants();
      saveDeletedPlantIds();
      refreshRows();
      refreshFilterOptions();
      search();
    }

    function findRowById(id) {
      const normalizedId = String(id || '').trim();
      return rows.find(row => String(row.ID || '').trim() === normalizedId) || null;
    }

    function refreshFilterOptions() {
      const currentValues = {};
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        currentValues[id] = select ? select.value : 'all';
      });

      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        select.innerHTML = '<option value="all">Alle</option>';
        uniqueValues(SELECT_FIELD_MAP[id]).forEach(value => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
        if (currentValues[id] && Array.from(select.options).some(option => option.value === currentValues[id])) {
          select.value = currentValues[id];
        }
      });

      Object.entries(AUTOCOMPLETE_FIELD_MAP).forEach(([id, field]) => {
        fieldSuggestionValues[id] = uniqueValues(field);
      });

    }

    function startsWithWord(value, query) {
      const normalizedValue = String(value || '').trim().toLowerCase();
      const normalizedQuery = String(query || '').trim().toLowerCase();
      if (!normalizedQuery) return true;
      if (!normalizedValue) return false;
      if (normalizedValue.startsWith(normalizedQuery)) return true;
      return normalizedValue
        .split(/[\s\-\/(),.;:]+/)
        .some(part => part.startsWith(normalizedQuery));
    }

    function renderFieldSuggestions(fieldId, query = '', showAll = false) {
      const input = document.getElementById(fieldId);
      const box = document.getElementById(`${fieldId}-suggestions`);
      if (!input || !box) return;

      const values = fieldSuggestionValues[fieldId] || [];
      const normalized = String(query || '').trim().toLowerCase();
      const matches = showAll || !normalized
        ? values
        : values.filter(value => startsWithWord(value, normalized));

      if (!matches.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.innerHTML = matches.map(value => `<div class="suggestion-item">${value}</div>`).join('');
      box.style.display = 'block';

      box.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('mousedown', event => {
          event.preventDefault();
          input.value = item.textContent || '';
          box.style.display = 'none';
          search();
        });
      });
    }

    function hideFieldSuggestions(fieldId) {
      const box = document.getElementById(`${fieldId}-suggestions`);
      if (box) {
        box.style.display = 'none';
      }
    }

    function hideAllFieldSuggestions() {
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(hideFieldSuggestions);
    }

    function isEditAllowed() {
      const enteredPassword = window.prompt('Passwort für das Bearbeiten eingeben:');
      if (enteredPassword === null) return false;
      if (enteredPassword !== EDIT_PASSWORD) {
        window.alert('Falsches Passwort.');
        return false;
      }
      return true;
    }

    function parseCsv(text) {
      const lines = text.replace(/\r/g,'').split('\n').filter(line => line.trim());
      const header = lines[0]
        .split(';')
        .map(cell => String(cell || '').replace(/^\uFEFF/, '').trim());
      const data = lines.slice(1).map(line => {
        const parts = line.split(';');
        const row = {};
        header.forEach((name, index) => row[name] = (parts[index] || '').trim());
        return row;
      });
      return {header, data};
    }

    function uniqueValues(field) {
      const values = new Set();
      rows.forEach(row => {
        const value = (row[field] || '').trim();
        if (value) values.add(value);
      });
      return Array.from(values).sort((a,b) => a.localeCompare(b, 'de'));
    }

    function fillDropdown(id, values) {
      const select = document.getElementById(id);
      if (!select) {
        console.warn(`Dropdown element not found: ${id}`);
        return;
      }
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function padId(id) {
      return String(id).padStart(3, '0');
    }

    function getImageCandidates(id, type = 'original') {
      const rawId = String(id || '').trim();
      if (!rawId) return [];
      const padded = padId(rawId);
      const candidates = [];
      const baseName = `PF-${padded}`;

      if (type === 'preview') {
        // Prefer numbered preview files like PF-003.1_web.webp first.
        for (let index = 1; index <= MAX_IMAGE_VARIANTS; index += 1) {
          IMAGE_EXTENSIONS.forEach(ext => {
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}_web.${ext}`);
          });
        }
        IMAGE_EXTENSIONS.forEach(ext => {
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}_web.${ext}`);
        });
      } else {
        // Match both preview-style _web files and plain image files.
        for (let index = 1; index <= MAX_IMAGE_VARIANTS; index += 1) {
          IMAGE_EXTENSIONS.forEach(ext => {
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}_web.${ext}`);
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}.${ext}`);
          });
        }
        IMAGE_EXTENSIONS.forEach(ext => {
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}_web.${ext}`);
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${ext}`);
        });
      }
      return Array.from(new Set(candidates));
    }

    function renderImageCell(row) {
      const cell = document.createElement('td');
      const wrapper = document.createElement('div');
      wrapper.className = 'image-cell';

      const id = row?.ID || '';
      const latinName = row?.['Name Latein'] || '';

      if (!id) {
        const placeholder = document.createElement('span');
        placeholder.textContent = 'kein Bild';
        placeholder.style.color = '#777';
        wrapper.appendChild(placeholder);
        cell.appendChild(wrapper);
        return cell;
      }

      const indexedImageFiles = getRowImageSources(row || {});
      const fallbackPreviewCandidates = getImageCandidates(id, 'preview');
      const imageFiles = indexedImageFiles.length
        ? indexedImageFiles
        : fallbackPreviewCandidates;
      if (!imageFiles.length) {
        const placeholder = document.createElement('span');
        placeholder.textContent = 'kein Bild vorhanden';
        placeholder.style.color = '#777';
        wrapper.appendChild(placeholder);
        cell.appendChild(wrapper);
        return cell;
      }

      const originalCandidates = indexedImageFiles.length ? indexedImageFiles : imageFiles;

      const previewArea = document.createElement('button');
      previewArea.type = 'button';
      previewArea.style.width = '90px';
      previewArea.style.maxWidth = '100%';
      previewArea.style.aspectRatio = '1 / 1';
      previewArea.style.height = 'auto';
      previewArea.style.display = 'flex';
      previewArea.style.alignItems = 'center';
      previewArea.style.justifyContent = 'center';
      previewArea.style.background = '#fafafa';
      previewArea.style.borderRadius = '8px';
      previewArea.style.border = '1px solid #ddd';
      previewArea.style.padding = '0.5rem';
      previewArea.style.cursor = 'pointer';
      previewArea.style.overflow = 'hidden';
      previewArea.style.color = '#333';
      previewArea.style.fontSize = '0.8rem';
      previewArea.style.textAlign = 'center';
      previewArea.textContent = 'Bilder anzeigen';

      const openOriginalPopup = () => {
        const schemaCandidates = indexedImageFiles.length
          ? []
          : [...getImageCandidates(id, 'original'), ...getImageCandidates(id, 'preview')];
        const popupSources = Array.from(new Set([...originalCandidates, ...schemaCandidates]));
        openImagePopup(popupSources, latinName || id);
      };

      previewArea.title = 'Klicke für Originalbilder';
      previewArea.addEventListener('click', openOriginalPopup);

      wrapper.appendChild(previewArea);
      cell.appendChild(wrapper);

      return cell;
    }

    function loadPreviewImage(sources, imageContainer, button, onSuccess, id) {
      const candidates = Array.isArray(sources) ? sources.filter(Boolean) : [sources].filter(Boolean);
      imageContainer.innerHTML = '';
      const status = document.createElement('span');
      status.textContent = 'Suche Vorschau...';
      status.style.color = '#777';
      imageContainer.appendChild(status);
      if (!candidates.length) {
        imageContainer.innerHTML = '';
        const placeholder = document.createElement('span');
        placeholder.textContent = 'kein Bild vorhanden';
        placeholder.style.color = '#777';
        imageContainer.appendChild(placeholder);
        return;
      }

      let candidateIndex = 0;
      const tryLoad = () => {
        const src = candidates[candidateIndex];
        const img = document.createElement('img');
        img.alt = `Vorschau ${id}`;
        img.className = 'image-modal-img';
        img.style.maxWidth = '100%';
        img.style.maxHeight = '100%';
        img.style.objectFit = 'contain';
        img.onload = () => {
          imageContainer.innerHTML = '';
          imageContainer.appendChild(img);
          if (typeof onSuccess === 'function') onSuccess(src);
          if (button) {
            button.textContent = 'Vorschau geladen';
            button.disabled = true;
          }
        };
        img.onerror = () => {
          candidateIndex += 1;
          if (candidateIndex < candidates.length) {
            tryLoad();
            return;
          }
          imageContainer.innerHTML = '';
          const placeholder = document.createElement('span');
          placeholder.textContent = 'Bild konnte nicht geladen werden';
          placeholder.style.color = '#777';
          imageContainer.appendChild(placeholder);
          if (button) {
            button.textContent = 'Vorschau laden';
            button.disabled = false;
          }
        };
        img.src = src;
      };

      tryLoad();
    }

    function openImagePopup(imageSources, titleText) {
      const overlay = document.createElement('div');
      overlay.className = 'image-modal-overlay';
      overlay.tabIndex = -1;

      const closePopup = () => {
        document.removeEventListener('keydown', handleKeyDown);
        if (overlay.parentNode) {
          document.body.removeChild(overlay);
        }
      };

      function handleKeyDown(event) {
        if (event.key === 'Escape') {
          closePopup();
        }
      }

      const content = document.createElement('div');
      content.className = 'image-modal-content';

      const closeButton = document.createElement('button');
      closeButton.className = 'image-modal-close';
      closeButton.type = 'button';
      closeButton.textContent = '✕';
      closeButton.addEventListener('click', closePopup);

      const title = document.createElement('div');
      title.className = 'image-modal-title';
      title.textContent = `Originalbilder für ${titleText}`;

      const gallery = document.createElement('div');
      gallery.className = 'image-modal-gallery';
      const status = document.createElement('div');
      status.style.color = '#777';
      status.textContent = 'Bilder werden geladen...';
      gallery.appendChild(status);

      const uniqueSources = Array.from(new Set((imageSources || []).filter(Boolean)));
      let pending = uniqueSources.length;
      let loadedCount = 0;

      if (!pending) {
        status.textContent = 'keine Bilder gefunden';
      } else {
        uniqueSources.forEach(src => {
          const img = new Image();
          img.className = 'image-modal-img';
          img.alt = `Originalbild ${titleText}`;
          img.loading = 'lazy';
          img.onload = () => {
            loadedCount += 1;
            pending -= 1;
            img.src = src;
            gallery.appendChild(img);
            if (status.parentNode) {
              status.textContent = `Bilder geladen: ${loadedCount}`;
            }
            if (pending === 0 && status.parentNode) {
              if (loadedCount === 0) {
                status.textContent = 'keine Bilder gefunden';
              } else {
                status.remove();
              }
            }
          };
          img.onerror = () => {
            pending -= 1;
            if (pending === 0 && status.parentNode) {
              if (loadedCount === 0) {
                status.textContent = 'keine Bilder gefunden';
              } else {
                status.remove();
              }
            }
          };
          img.src = src;
        });
      }

      content.appendChild(closeButton);
      content.appendChild(title);
      content.appendChild(gallery);
      overlay.appendChild(content);

      overlay.addEventListener('click', event => {
        if (event.target === overlay) {
          closePopup();
        }
      });

      document.body.appendChild(overlay);
      document.addEventListener('keydown', handleKeyDown);
      overlay.focus();
    }

    function openPlantForm(existingRow = null) {
      const overlay = document.createElement('div');
      overlay.className = 'image-modal-overlay';
      overlay.tabIndex = -1;

      const content = document.createElement('div');
      content.className = 'image-modal-content';

      const closePopup = () => {
        document.removeEventListener('keydown', handleKeyDown);
        if (overlay.parentNode) {
          document.body.removeChild(overlay);
        }
      };

      function handleKeyDown(event) {
        if (event.key === 'Escape') {
          closePopup();
        }
      }

      const nextId = existingRow ? String(existingRow.ID || '') : getNextPlantId(rows);
      const monthCheckboxes = MONTH_FIELDS.map(month => `<label><input type="checkbox" name="plantMonths" value="${month}" /> ${month}</label>`).join('');
      const currentPhotos = Array.isArray(existingRow?.__photos) ? existingRow.__photos : [];
      const currentPhotoList = currentPhotos.length ? `<div class="image-modal-title" style="font-size: 0.95rem; font-weight: 600; margin-top: 0.25rem;">Vorhandene Fotos: ${currentPhotos.map(photo => photo.name || 'Foto').join(', ')}</div>` : '';

      const prefill = field => String(existingRow?.[field] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const checkedMonth = month => String(existingRow?.[month] || '0').trim() === '1' ? 'checked' : '';

      content.innerHTML = `
        <button class="image-modal-close" type="button">✕</button>
        <div class="image-modal-title">${existingRow ? 'Pflanze ändern' : 'Neue Pflanze hinzufügen'}</div>
        <form class="plant-modal-form" id="plantForm">
          <div class="plant-modal-grid">
            <div class="plant-modal-field"><label for="plantId">ID</label><input id="plantId" type="text" value="${nextId}" readonly /></div>
            <div class="plant-modal-field"><label for="plantNameDe">Name Deutsch</label><input id="plantNameDe" name="plantNameDe" type="text" value="${prefill('Name Deutsch')}" required /></div>
            <div class="plant-modal-field"><label for="plantNameLatin">Name Latein</label><input id="plantNameLatin" name="plantNameLatin" type="text" value="${prefill('Name Latein')}" required /></div>
            <div class="plant-modal-field"><label for="plantFamily">Pflanzenfamilie</label><input id="plantFamily" name="plantFamily" type="text" value="${prefill('Pflanzenfamilie')}" required /></div>
            <div class="plant-modal-field"><label for="plantGrowth">Wuchsform</label><input id="plantGrowth" name="plantGrowth" type="text" value="${prefill('Wuchsform')}" required /></div>
            <div class="plant-modal-field"><label for="plantColor">Blütenfarbe</label><input id="plantColor" name="plantColor" type="text" value="${prefill('Blütenfarbe')}" required /></div>
            <div class="plant-modal-field"><label for="plantPlanted">Gepflanzt</label><input id="plantPlanted" name="plantPlanted" type="text" value="${prefill('Gepflanzt')}" /></div>
          </div>
          <div class="plant-modal-field">
            <label>Blütenmonate</label>
            <div class="plant-modal-months">${MONTH_FIELDS.map(month => `<label><input type="checkbox" name="plantMonths" value="${month}" ${checkedMonth(month)} /> ${month}</label>`).join('')}</div>
          </div>
          <div class="plant-modal-field plant-modal-photos">
            <label for="plantPhotos">Fotos</label>
            <input id="plantPhotos" type="file" accept="image/*" multiple />
            <small>Mehrere Bilder kannst du gleichzeitig auswählen.</small>
            ${currentPhotoList}
          </div>
          <div class="plant-modal-actions">
            <button type="button" id="cancelPlantButton">Abbrechen</button>
            ${existingRow ? '<button type="button" id="deletePlantButton" class="danger">Pflanze löschen</button>' : ''}
            <button type="submit">Pflanze speichern</button>
          </div>
        </form>
      `;

      const closeButton = content.querySelector('.image-modal-close');
      const cancelButton = content.querySelector('#cancelPlantButton');
      const deleteButton = content.querySelector('#deletePlantButton');
      const form = content.querySelector('#plantForm');
      const closeHandlers = [closeButton, cancelButton].filter(Boolean);
      closeHandlers.forEach(button => button.addEventListener('click', closePopup));

      if (deleteButton && existingRow) {
        deleteButton.addEventListener('click', () => {
          const label = existingRow['Name Latein'] || existingRow['Name Deutsch'] || existingRow.ID;
          const confirmed = window.confirm(`Möchtest du ${label} wirklich löschen?`);
          if (!confirmed) return;
          deletePlantById(existingRow.ID);
          closePopup();
        });
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const formData = new FormData(form);
        const selectedMonths = Array.from(form.querySelectorAll('input[name="plantMonths"]:checked')).map(input => input.value);
        const photoFiles = Array.from(document.getElementById('plantPhotos').files || []);
        const uploadedPhotos = await Promise.all(photoFiles.map(async file => ({
          name: file.name,
          src: await readFileAsDataUrl(file)
        })));

        const newRow = {};
        fieldNames.forEach(name => {
          newRow[name] = '';
        });
        newRow.ID = nextId;
        newRow['Name Deutsch'] = String(formData.get('plantNameDe') || '').trim();
        newRow['Name Latein'] = String(formData.get('plantNameLatin') || '').trim();
        newRow['Pflanzenfamilie'] = String(formData.get('plantFamily') || '').trim();
        newRow['Wuchsform'] = String(formData.get('plantGrowth') || '').trim();
        newRow['Blütenfarbe'] = String(formData.get('plantColor') || '').trim();
        newRow['Gepflanzt'] = String(formData.get('plantPlanted') || '').trim();
        MONTH_FIELDS.forEach(month => {
          newRow[month] = selectedMonths.includes(month) ? '1' : '0';
        });

        const existingPhotos = Array.isArray(existingRow?.__photos) ? existingRow.__photos : [];
        newRow.__photos = photoFiles.length ? uploadedPhotos : existingPhotos;

        const normalizedRow = normalizeManualPlant(newRow);
        manualPlants = manualPlants.filter(row => String(row.ID) !== String(nextId));
        manualPlants.push(normalizedRow);
        saveManualPlants();
        deletedPlantIds = deletedPlantIds.filter(id => String(id) !== String(nextId));
        saveDeletedPlantIds();
        refreshRows();
        refreshFilterOptions();
        closePopup();
        search();
      });

      overlay.appendChild(content);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) {
          closePopup();
        }
      });

      document.body.appendChild(overlay);
      document.addEventListener('keydown', handleKeyDown);
      overlay.focus();
      const nameInput = content.querySelector('#plantNameDe');
      if (nameInput) nameInput.focus();
    }

    function loadAllImages(candidates, imageContainer, button, id) {
      imageContainer.innerHTML = '';
      const status = document.createElement('span');
      status.textContent = 'Lädt Originale...';
      status.style.color = '#777';
      imageContainer.appendChild(status);

      let loadedCount = 0;
      let pending = candidates.length;
      if (pending === 0) {
        imageContainer.innerHTML = '';
        const placeholder = document.createElement('span');
        placeholder.textContent = 'keine Originalbilder gefunden';
        placeholder.style.color = '#777';
        imageContainer.appendChild(placeholder);
        return;
      }
      candidates.forEach(src => {
        const img = document.createElement('img');
        img.alt = `Originalbild ${id}`;
        img.loading = 'lazy';
        img.className = 'image-modal-img';
        img.onload = () => {
          if (status.parentNode) imageContainer.removeChild(status);
          loadedCount += 1;
          imageContainer.appendChild(img);
          if (button) {
            button.textContent = 'Originale geladen';
            button.disabled = true;
          }
        };
        img.onerror = () => {
          pending -= 1;
          if (pending === 0 && loadedCount === 0) {
            imageContainer.innerHTML = '';
            const placeholder = document.createElement('span');
            placeholder.textContent = 'keine Originalbilder gefunden';
            placeholder.style.color = '#777';
            imageContainer.appendChild(placeholder);
            if (button) {
              button.textContent = 'Originale anzeigen';
              button.disabled = false;
            }
          }
        };
        img.src = src;
      });
    }

    function openEditDialog() {
      if (!isEditAllowed()) return;
      const id = window.prompt('Welche ID möchtest du ändern?');
      if (id === null) return;
      const row = findRowById(id);
      if (!row) {
        window.alert('Keine Pflanze mit dieser ID gefunden.');
        return;
      }
      openPlantForm(row);
    }

    function openDeleteDialog() {
      const id = window.prompt('Welche ID möchtest du löschen?');
      if (id === null) return;
      const row = findRowById(id);
      if (!row) {
        window.alert('Keine Pflanze mit dieser ID gefunden.');
        return;
      }
      const label = row['Name Latein'] || row['Name Deutsch'] || row.ID;
      const confirmed = window.confirm(`Möchtest du ${label} wirklich löschen?`);
      if (!confirmed) return;
      deletePlantById(row.ID);
      search();
    }

    function openManagementPopup() {
      const existingOverlay = document.querySelector('.image-modal-overlay');
      if (existingOverlay) {
        existingOverlay.remove();
      }

      const overlay = document.createElement('div');
      overlay.className = 'image-modal-overlay';
      overlay.tabIndex = -1;

      const content = document.createElement('div');
      content.className = 'image-modal-content';
      content.innerHTML = `
        <button class="image-modal-close" type="button">✕</button>
        <div class="image-modal-title">Pflanzen bearbeiten</div>
        <div class="management-popup-actions">
          <button type="button" id="managementAddButton">Pflanze hinzufügen</button>
          <button type="button" id="managementEditButton">Pflanze ändern</button>
          <button type="button" id="managementDeleteButton">Pflanze löschen</button>
        </div>
      `;

      const closePopup = () => {
        overlay.remove();
        document.removeEventListener('keydown', handleKeyDown);
      };

      const handleKeyDown = event => {
        if (event.key === 'Escape') {
          closePopup();
        }
      };

      content.querySelector('.image-modal-close').addEventListener('click', closePopup);
      content.querySelector('#managementAddButton').addEventListener('click', () => {
        closePopup();
        openPlantForm();
      });
      content.querySelector('#managementEditButton').addEventListener('click', () => {
        closePopup();
        const id = window.prompt('Welche ID möchtest du ändern?');
        if (id === null) return;
        const row = findRowById(id);
        if (!row) {
          window.alert('Keine Pflanze mit dieser ID gefunden.');
          return;
        }
        openPlantForm(row);
      });
      content.querySelector('#managementDeleteButton').addEventListener('click', () => {
        closePopup();
        openDeleteDialog();
      });

      overlay.appendChild(content);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) {
          closePopup();
        }
      });

      document.body.appendChild(overlay);
      document.addEventListener('keydown', handleKeyDown);
      overlay.focus();
    }

    function formatBloomRange(row) {
      const activeMonths = MONTH_FIELDS.filter(month => String(row[month] || '').trim() === '1');
      if (!activeMonths.length) return '';
      if (activeMonths.length === 1) return activeMonths[0];
      return `${activeMonths[0]} - ${activeMonths[activeMonths.length - 1]}`;
    }

    function hasDisplayImages(row) {
      const hasIndexedImages = getImageFilesForId(row?.ID || '').length > 0;
      const hasManualPhotos = Array.isArray(row?.__photos) && row.__photos.some(photo => photo?.src);
      return hasIndexedImages || hasManualPhotos;
    }

    function sortRowsForDisplay(rowsToSort) {
      return [...rowsToSort].sort((a, b) => {
        const aHasImages = hasDisplayImages(a) ? 1 : 0;
        const bHasImages = hasDisplayImages(b) ? 1 : 0;
        if (aHasImages === bHasImages) return 0;
        return aHasImages - bHasImages;
      });
    }

    function renderTable(filtered) {
      const result = document.getElementById('result');
      if (!filtered.length) {
        result.innerHTML = '<p>Keine Treffer gefunden.</p>';
        return;
      }
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const monthStartIndex = fieldNames.findIndex(name => MONTH_FIELDS.includes(name));
      const monthInsertIndex = monthStartIndex >= 0 ? monthStartIndex : fieldNames.length;
      const visibleFields = fieldNames.filter(name => !MONTH_FIELDS.includes(name));
      const fieldsWithBloomRange = [...visibleFields];
      fieldsWithBloomRange.splice(monthInsertIndex, 0, 'Blütenmonate');

      const headers = ['Bild', ...fieldsWithBloomRange];
      headers.forEach(name => {
        const th = document.createElement('th');
        th.textContent = name;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      const displayRows = sortRowsForDisplay(filtered);
      displayRows.forEach(row => {
        const tr = document.createElement('tr');
        tr.appendChild(renderImageCell(row));
        fieldsWithBloomRange.forEach(name => {
          const td = document.createElement('td');
          td.textContent = name === 'Blütenmonate' ? formatBloomRange(row) : (row[name] || '');
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      const wrapper = document.createElement('div');
      wrapper.className = 'table-scroll';
      wrapper.appendChild(table);
      result.innerHTML = '';
      result.appendChild(wrapper);
    }

    function matchesFilter(value, selected) {
      if (selected === 'all') return true;
      return String(value || '').trim() === selected;
    }

    function resetFilters() {
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
        const input = document.getElementById(id);
        if (input) input.value = '';
      });
      const monthSelect = document.getElementById('field-month');
      if (monthSelect) {
        monthSelect.querySelectorAll('option').forEach(option => {
          option.selected = option.value === 'all';
        });
      }
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        if (select) select.value = 'all';
      });
      hideAllFieldSuggestions();
      document.getElementById('status').textContent = `Daten geladen: ${rows.length} Zeile(n)`;
      renderTable(rows);
    }

    function search() {
      const monthSelect = document.getElementById('field-month');
      const selectedMonths = monthSelect ? Array.from(monthSelect.selectedOptions).map(option => option.value) : ['all'];
      const months = selectedMonths.includes('all') || selectedMonths.length === 0 ? ['all'] : selectedMonths;
      const textFilters = {};
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
        textFilters[AUTOCOMPLETE_FIELD_MAP[id]] = String(document.getElementById(id)?.value || '').trim().toLowerCase();
      });
      const selectFilters = {};
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        selectFilters[SELECT_FIELD_MAP[id]] = document.getElementById(id).value;
      });

      const filtered = rows.filter(row => {
        for (const [field, selectedText] of Object.entries(textFilters)) {
          if (!selectedText) continue;
          const value = String(row[field] || '').toLowerCase();
          if (!startsWithWord(value, selectedText)) return false;
        }
        for (const [field, selected] of Object.entries(selectFilters)) {
          if (!matchesFilter(row[field], selected)) return false;
        }
        if (months[0] !== 'all') {
          if (!months.some(month => String(row[month] || '').trim() === '1')) return false;
        }
        return true;
      });

      document.getElementById('status').textContent = `${filtered.length} Ergebnis(se)`;
      renderTable(filtered);
    }

    async function init() {
      const status = document.getElementById('status');
      try {
        const response = await fetch(`${CSV_FILE}?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('CSV-Datei konnte nicht geladen werden.');
        const text = await response.text();
        const parsed = parseCsv(text);
        fieldNames = parsed.header.filter(name => name && name !== 'Notizen');
        baseRows = parsed.data;
        manualPlants = loadManualPlants();
        deletedPlantIds = loadDeletedPlantIds();
        refreshRows();

        try {
          const imageResponse = await fetch(`${IMAGE_INDEX_FILE}?v=${Date.now()}`, { cache: 'no-store' });
          if (imageResponse.ok) {
            imageIndex = await imageResponse.json();
          } else {
            console.warn(`Bildindex konnte nicht geladen werden: ${imageResponse.status}`);
          }
        } catch (error) {
          console.warn('Bildindex konnte nicht geladen werden:', error);
        }

        status.textContent = `Daten geladen: ${rows.length} Zeile(n)`;

        refreshFilterOptions();

        Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener('input', event => {
            search();
            renderFieldSuggestions(id, event.target.value || '', false);
          });
          input.addEventListener('focus', () => {
            renderFieldSuggestions(id, '', true);
          });
        });

        const searchInputs = ['field-growth', 'field-color', 'field-planted'];
        searchInputs.forEach(id => {
          const element = document.getElementById(id);
          if (!element) return;
          element.addEventListener('input', search);
          element.addEventListener('change', search);
        });

        const monthSelect = document.getElementById('field-month');
        if (monthSelect) {
          monthSelect.classList.add('compact');
          monthSelect.addEventListener('click', () => {
            monthSelect.size = monthSelect.size === 1 ? 12 : 1;
          });
          monthSelect.addEventListener('mousedown', event => {
            if (event.target.tagName !== 'OPTION') return;
            event.preventDefault();
            const option = event.target;
            if (option.value === 'all') {
              Array.from(monthSelect.options).forEach(opt => {
                opt.selected = opt.value === 'all';
              });
            } else {
              option.selected = !option.selected;
              const allOption = monthSelect.querySelector('option[value="all"]');
              if (allOption) allOption.selected = false;
              const anyMonthSelected = Array.from(monthSelect.options).some(opt => opt.selected && opt.value !== 'all');
              if (!anyMonthSelected && allOption) {
                allOption.selected = true;
              }
            }
            search();
          });
          monthSelect.addEventListener('change', search);
        }

        document.addEventListener('click', event => {
          if (event.target.closest('.autocomplete-wrapper')) return;
          hideAllFieldSuggestions();
        });

        document.getElementById('resetButton').addEventListener('click', event => {
          event.preventDefault();
          resetFilters();
        });
        const editEntryButton = document.getElementById('editEntryButton');
        if (editEntryButton) {
          editEntryButton.addEventListener('click', event => {
            event.preventDefault();
            if (!isEditAllowed()) return;
            openManagementPopup();
          });
        }
        renderTable(rows);
      } catch (error) {
        status.innerHTML = '<span class="error">Fehler: ' + error.message + '</span>';
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
