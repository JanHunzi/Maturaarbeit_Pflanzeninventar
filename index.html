<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflanzeninventar Suche</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 1rem; line-height: 1.5; box-sizing: border-box; }
    .container { width: 100%; max-width: 100%; margin: 0; }
    .page-header {
      margin: 0 0 1rem;
      position: relative;
    }
    .page-header-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: #222;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
    }
    .admin-edit-toggle {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #2d3a4a;
      border: 1px solid #bcc6d1;
      border-radius: 50%;
    }
    .admin-edit-toggle:hover { background: #f5f8fb; }
    .admin-edit-toggle svg { width: 100%; height: 100%; }
    .admin-toolbar {
      position: absolute;
      top: 0.5rem;
      right: 3.25rem;
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      transform: translateX(15px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .admin-toolbar.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .admin-toolbar button {
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      background: #fff;
      color: #2d3a4a;
      border: 1px solid #bcc6d1;
    }
    .admin-toolbar button:hover { background: #f5f8fb; border-color: #a7b4c2; }
    .admin-toolbar .danger { color: #a61d1d; border-color: #e2b3b3; }
    .admin-toolbar .danger:hover { background: #fbeaea; }
    .toolbar { display: grid; width: 100%; gap: 1rem; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 1rem; }
    .toolbar > div { min-width: 0; }
    .toolbar label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .autocomplete-wrapper { position: relative; }
    .suggestions { position: absolute; top: calc(100% + 0.25rem); left: 0; right: 0; width: 100%; box-sizing: border-box; background: #fff; border: 1px solid #bbb; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-height: min(45vh, 360px); overflow-y: auto; z-index: 10; display: none; }
    .toolbar .toolbar-reset {
      width: 100%;
      margin-left: auto;
      background: #fff;
      color: #2d3a4a;
      border: 1px solid #bbb;
    }
    .toolbar .toolbar-reset:hover {
      background: #f7f9fc;
    }
    .toolbar-reset-wrap { align-self: end; }
    .filter-select-field { position: relative; }
    .multi-select-trigger { text-align: left; background: #fff; color: #222; font-weight: 400; border: 1px solid #bbb; border-radius: 5px; box-sizing: border-box; }
    .multi-select-trigger:hover { background: #f7f9fc; }
    .visually-hidden-multiselect { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .suggestion-item.selected { background: #eaf2fc; font-weight: 600; }
    .suggestion-item { display: block; width: 100%; padding: 0.5rem 0.7rem; box-sizing: border-box; cursor: pointer; }
    .suggestion-item:hover { background: #f4f7fb; }
    .suggestion-item strong,
    .suggestion-item span { display: block; }
    .suggestion-item span { color: #5d6672; font-size: 0.9rem; }
    .image-cell { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .image-cell img { max-width: 220px; max-height: 160px; width: auto; height: auto; object-fit: contain; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .image-cell button { width: auto; padding: 0.45rem 0.75rem; border-radius: 5px; border: 1px solid #bbb; background: #fff; color: #333; cursor: pointer; }
    .image-cell button:hover { background: #f7f9fc; }
    select, input[type=text], button { width: 100%; height: 2.7rem; padding: 0.55rem 0.7rem; border: 1px solid #bbb; border-radius: 5px; box-sizing: border-box; }
    button { cursor: pointer; background: #2a7ae2; color: #fff; border: none; transition: background 0.2s ease; }
    button:hover { background: #1c61c3; }
    .table-scroll { width: 100%; max-width: 100%; overflow-x: hidden; margin-top: 1rem; }
    table { width: 100%; max-width: 100%; table-layout: fixed; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 0.45rem; text-align: left; overflow-wrap: anywhere; }
    th:nth-child(1), td:nth-child(1) { width: 12%; }
    th:nth-child(2), td:nth-child(2) { width: 16%; }
    th:nth-child(3), td:nth-child(3) { width: 17%; }
    th { background: #f4f4f4; }
    .footer { margin-top: 1rem; color: #555; }
    .spinner { display: inline-block; margin-left: 0.5rem; }
    .error { color: #b00; }
    .image-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    .image-modal-content {
      width: min(100%, 960px);
      max-height: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      padding: 1rem;
    }
    .plant-selector-panel {
      width: min(100%, 420px);
      height: 100%;
      max-height: none;
      margin-left: auto;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .plant-selector-panel .plant-modal-field {
      flex: 0 0 auto;
    }
    .plant-selector-results {
      display: grid;
      gap: 0.5rem;
      overflow-y: auto;
      margin-top: 1rem;
      padding-right: 0.25rem;
    }
    .plant-selector-item {
      width: 100%;
      height: auto;
      min-height: 3.4rem;
      padding: 0.65rem 0.75rem;
      text-align: left;
      background: #f7f9fc;
      color: #222;
      border: 1px solid #d5dbe3;
      border-radius: 5px;
    }
    .plant-selector-item:hover {
      background: #eaf2fc;
      border-color: #2a7ae2;
    }
    .plant-selector-item strong,
    .plant-selector-item span {
      display: block;
    }
    .plant-selector-item span {
      color: #5d6672;
      font-size: 0.9rem;
    }
    .plant-selector-empty {
      color: #777;
      margin: 0;
    }
    .image-modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 2rem;
      height: 2rem;
      border: none;
      background: #222;
      color: #fff;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }
    .image-modal-title {
      margin-bottom: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .image-modal-gallery {
      display: grid;
      gap: 0.75rem;
    }
    .image-modal-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .plant-modal-form {
      display: grid;
      gap: 0.9rem;
    }
    .plant-modal-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .plant-modal-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .plant-modal-months {
      display: grid;
      gap: 0.4rem;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    }
    .plant-modal-months label,
    .plant-modal-photos label {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      font-weight: 400;
      margin-bottom: 0;
    }
    .plant-modal-photos {
      display: grid;
      gap: 0.5rem;
    }
    .plant-modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .plant-modal-actions .danger {
      background: #c62828;
      color: #fff;
    }
    .plant-modal-actions .danger:hover {
      background: #a61d1d;
    }
    @media (max-width: 900px) {
      body { padding: 0.75rem; }
      .toolbar { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .toolbar-reset-wrap { grid-column: auto; }
      th, td { padding: 0.35rem; font-size: 0.9rem; }
      .image-cell img { max-width: 100%; max-height: 110px; }
    }
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      h1 { font-size: 1.4rem; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar-reset-wrap { grid-column: auto; }
      .image-cell { gap: 0.25rem; }
      th, td { padding: 0.25rem; font-size: 0.78rem; }
      .image-cell img { max-height: 80px; }
      .image-modal-content { padding: 0.85rem; }
      .plant-selector-panel { width: 100%; }
      .plant-modal-grid { grid-template-columns: 1fr; }
      .plant-modal-months { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="page-header-inner">
        <h1>Pflanzeninventar</h1>
      </div>
      <button id="adminEditToggle" class="admin-edit-toggle" type="button" title="Bearbeiten" aria-label="Bearbeiten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/><path d="m18.5 2.5 3 3L12 15l-4 1 1-4Z"/></svg>
      </button>
      <div id="adminToolbar" class="admin-toolbar">
        <button id="addPlantButton" type="button">Pflanze hinzufügen</button>
        <button id="editPlantButton" type="button">Pflanze bearbeiten</button>
        <button id="deletePlantButtonMain" class="danger" type="button">Pflanze löschen</button>
      </div>
    </header>

      <div class="toolbar">
        <div>
          <label for="field-name-de">Name Deutsch</label>
          <div class="autocomplete-wrapper">
            <input id="field-name-de" type="text" placeholder="Name Deutsch suchen" autocomplete="off" />
            <div id="field-name-de-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-name-latin">Name Latein</label>
          <div class="autocomplete-wrapper">
            <input id="field-name-latin" type="text" placeholder="Name Latein suchen" autocomplete="off" />
            <div id="field-name-latin-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-family">Pflanzenfamilie</label>
          <div class="autocomplete-wrapper">
            <input id="field-family" type="text" placeholder="Pflanzenfamilie suchen" autocomplete="off" />
            <div id="field-family-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-growth">Wuchsform</label>
          <div class="autocomplete-wrapper">
            <input id="field-growth" type="text" placeholder="Wuchsform suchen" autocomplete="off" />
            <div id="field-growth-suggestions" class="suggestions"></div>
          </div>
        </div>
        <div class="filter-select-field">
          <label for="field-month-trigger">Blütenmonate</label>
          <button type="button" id="field-month-trigger" class="multi-select-trigger">Alle Monate</button>
          <div id="field-month-suggestions" class="suggestions"></div>
          <select id="field-month" multiple class="visually-hidden-multiselect">
            <option value="all">Alle Monate</option>
            <option>Jan</option>
            <option>Feb</option>
            <option>Mar</option>
            <option>Apr</option>
            <option>Mai</option>
            <option>Jun</option>
            <option>Jul</option>
            <option>Aug</option>
            <option>Sep</option>
            <option>Okt</option>
            <option>Nov</option>
            <option>Dez</option>
          </select>
        </div>
        <div class="filter-select-field">
          <label for="field-color-trigger">Blütenfarbe</label>
          <button type="button" id="field-color-trigger" class="multi-select-trigger">Alle Farben</button>
          <div id="field-color-suggestions" class="suggestions"></div>
          <select id="field-color" multiple class="visually-hidden-multiselect">
            <option value="all">Alle Farben</option>
            <option value="rot">Rot</option>
            <option value="orange">Orange</option>
            <option value="gelb">Gelb</option>
            <option value="grün">Grün</option>
            <option value="blau">Blau</option>
            <option value="violett">Violett</option>
            <option value="rosa">Rosa</option>
            <option value="weiss">Weiss</option>
          </select>
        </div>
        <div class="toolbar-reset-wrap">
          <button id="resetButton" class="toolbar-reset" type="button">Suche zurücksetzen</button>
        </div>
      </div>

    <div class="footer" id="status">Lade Daten...</div>

    <div id="result"></div>
  </div>

  <script>
    const CSV_FILE = 'Pflanzenliste_Maturaarbeit_DBV5.0_cvs.csv';
    const AUTOCOMPLETE_FIELD_MAP = {
      'field-name-de': 'Name Deutsch',
      'field-name-latin': 'Name Latein',
      'field-family': 'Pflanzenfamilie',
      'field-growth': 'Wuchsform'
    };
    const SELECT_FIELD_MAP = {};
    const FIELD_MAP = { ...AUTOCOMPLETE_FIELD_MAP, ...SELECT_FIELD_MAP };
    const MONTH_FIELDS = ['Jan','Feb','Mar','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const COLOR_FIELDS = ['rot','orange','gelb','grün','blau','violett','rosa','weiss'];
    const IMAGE_BASE_PATH = 'imgV4';
    const IMAGE_INDEX_FILE = 'imgV4/image_index.json';
    const IMAGE_EXTENSIONS = ['webp', 'jpg', 'jpeg', 'png'];
    const MAX_IMAGE_VARIANTS = 8;
    const EDIT_PASSWORD = 'JanHunziker';
    const MANUAL_PLANTS_STORAGE_KEY = 'pflanzeninventar_manual_plants';
    const DELETED_PLANTS_STORAGE_KEY = 'pflanzeninventar_deleted_plants';
    const MANUAL_ROW_FIELDS = ['ID', 'Name Deutsch', 'Name Latein', 'Pflanzenfamilie', 'Wuchsform', 'Blütenfarbe', ...MONTH_FIELDS];
    const EDITABLE_FIELDS = ['Name Deutsch', 'Name Latein', 'Pflanzenfamilie', 'Wuchsform', 'Blütenfarbe'];
    let rows = [];
    let baseRows = [];
    let fieldNames = [];
    let fieldSuggestionValues = {
      'field-name-de': [],
      'field-name-latin': [],
      'field-family': [],
      'field-growth': []
    };
    let imageIndex = {};
    let manualPlants = [];
    let deletedPlantIds = [];

    function getImageFilesForId(id) {
      const key = String(Number(id));
      const files = imageIndex[key] || [];
      return files.map(name => `${IMAGE_BASE_PATH}/${name}`);
    }

    function safeJsonParse(value, fallback) {
      try {
        return JSON.parse(value);
      } catch (error) {
        return fallback;
      }
    }

    function getNextPlantId(sourceRows) {
      const ids = sourceRows
        .map(row => Number.parseInt(row.ID, 10))
        .filter(number => Number.isFinite(number));
      const nextId = ids.length ? Math.max(...ids) + 1 : 1;
      return String(nextId);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error(`Datei konnte nicht gelesen werden: ${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    function normalizeManualPlant(entry) {
      if (!entry || typeof entry !== 'object') return null;
      const row = {};
      MANUAL_ROW_FIELDS.forEach(field => {
        row[field] = String(entry[field] ?? '').trim();
      });
      row.ID = String(entry.ID ?? '').trim();
      MONTH_FIELDS.forEach(month => {
        row[month] = String(entry[month] ?? '0').trim() === '1' ? '1' : '0';
      });
      row.__photos = Array.isArray(entry.__photos)
        ? entry.__photos.map(photo => ({
            name: String(photo?.name || '').trim(),
            src: String(photo?.src || '').trim()
          })).filter(photo => photo.src)
        : [];
      return row;
    }

    function mergeRows(baseRows, overrides) {
      const overrideMap = new Map();
      overrides.forEach(row => {
        if (row && row.ID) {
          overrideMap.set(String(row.ID), row);
        }
      });

      const merged = baseRows.map(row => {
        const override = overrideMap.get(String(row.ID));
        if (!override) return row;
        return {
          ...row,
          ...override,
          __photos: Array.isArray(override.__photos) ? override.__photos : (Array.isArray(row.__photos) ? row.__photos : [])
        };
      });

      overrides.forEach(row => {
        if (!row || !row.ID) return;
        const existing = baseRows.some(baseRow => String(baseRow.ID) === String(row.ID));
        if (!existing) merged.push(row);
      });

      return merged;
    }

    function loadDeletedPlantIds() {
      const stored = safeJsonParse(localStorage.getItem(DELETED_PLANTS_STORAGE_KEY) || '[]', []);
      if (!Array.isArray(stored)) return [];
      return stored.map(id => String(id || '').trim()).filter(Boolean);
    }

    function loadManualPlants() {
      const stored = safeJsonParse(localStorage.getItem(MANUAL_PLANTS_STORAGE_KEY) || '[]', []);
      if (!Array.isArray(stored)) return [];
      return stored.map(normalizeManualPlant).filter(Boolean);
    }

    function saveManualPlants() {
      localStorage.setItem(MANUAL_PLANTS_STORAGE_KEY, JSON.stringify(manualPlants));
    }

    function saveDeletedPlantIds() {
      localStorage.setItem(DELETED_PLANTS_STORAGE_KEY, JSON.stringify(deletedPlantIds));
    }

    function isDeletedPlantId(id) {
      return deletedPlantIds.includes(String(id || '').trim());
    }

    function refreshRows() {
      rows = mergeRows(baseRows, manualPlants).filter(row => !isDeletedPlantId(row.ID));
    }

    function getRowImageSources(row) {
      const uploadedSources = Array.isArray(row.__photos)
        ? row.__photos.map(photo => photo.src).filter(Boolean)
        : [];
      const indexedSources = row.ID ? getImageFilesForId(row.ID) : [];
      return uploadedSources.length ? [...uploadedSources, ...indexedSources] : indexedSources;
    }

    function deletePlantById(id) {
      const normalizedId = String(id || '').trim();
      if (!normalizedId) return;
      manualPlants = manualPlants.filter(row => String(row.ID) !== normalizedId);
      if (!deletedPlantIds.includes(normalizedId)) {
        deletedPlantIds.push(normalizedId);
      }
      saveManualPlants();
      saveDeletedPlantIds();
      refreshRows();
      refreshFilterOptions();
      search();
    }

    function findRowById(id) {
      const normalizedId = String(id || '').trim();
      return rows.find(row => String(row.ID || '').trim() === normalizedId) || null;
    }

    function refreshFilterOptions() {
      const currentValues = {};
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        currentValues[id] = select?.multiple
          ? Array.from(select.selectedOptions).map(option => option.value)
          : (select ? select.value : 'all');
      });

      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        select.innerHTML = '<option value="all">Alle</option>';
        uniqueValues(SELECT_FIELD_MAP[id]).forEach(value => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
        const selectedValues = Array.isArray(currentValues[id]) ? currentValues[id] : [currentValues[id]];
        const availableValues = selectedValues.filter(value => Array.from(select.options).some(option => option.value === value));
        if (availableValues.length) {
          select.querySelectorAll('option').forEach(option => {
            option.selected = availableValues.includes(option.value);
          });
        } else {
          select.value = 'all';
        }
      });

      Object.entries(AUTOCOMPLETE_FIELD_MAP).forEach(([id, field]) => {
        fieldSuggestionValues[id] = uniqueValues(field);
      });

    }

    function startsWithWord(value, query) {
      const normalizedValue = String(value || '').trim().toLowerCase();
      const normalizedQuery = String(query || '').trim().toLowerCase();
      if (!normalizedQuery) return true;
      if (!normalizedValue) return false;
      if (normalizedValue.startsWith(normalizedQuery)) return true;
      return normalizedValue
        .split(/[\s\-\/(),.;:]+/)
        .some(part => part.startsWith(normalizedQuery));
    }

    function renderFieldSuggestions(fieldId, query = '', showAll = false) {
      const input = document.getElementById(fieldId);
      const box = document.getElementById(`${fieldId}-suggestions`);
      if (!input || !box) return;

      const nameField = fieldId === 'field-name-de' ? 'Name Deutsch' : fieldId === 'field-name-latin' ? 'Name Latein' : '';
      const isPlantNameSearch = Boolean(nameField);
      const values = fieldSuggestionValues[fieldId] || [];
      const normalized = String(query || '').trim().toLowerCase();
      const matches = isPlantNameSearch
        ? rows.filter(row => showAll || !normalized || startsWithWord(row[nameField], normalized))
        : (showAll || !normalized
          ? values
          : values.filter(value => startsWithWord(value, normalized)));

      if (!matches.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.innerHTML = '';
      box.style.display = 'block';

      matches.forEach(match => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        if (isPlantNameSearch) {
          item.textContent = match[nameField] || 'Ohne Namen';
        } else {
          item.textContent = match;
        }
        box.appendChild(item);
        item.addEventListener('mousedown', event => {
          event.preventDefault();
          input.value = isPlantNameSearch
            ? String(match[nameField] || '')
            : String(match || '');
          box.style.display = 'none';
          search();
        });
      });
    }

    function hideFieldSuggestions(fieldId) {
      const box = document.getElementById(`${fieldId}-suggestions`);
      if (box) {
        box.style.display = 'none';
      }
    }

    function hideAllFieldSuggestions() {
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(hideFieldSuggestions);
    }

    const MULTI_SELECT_LABELS = {
      'field-month': 'Alle Monate',
      'field-color': 'Alle Farben'
    };

    function closeMultiSelects() {
      Object.keys(MULTI_SELECT_LABELS).forEach(id => {
        const box = document.getElementById(`${id}-suggestions`);
        if (box) box.style.display = 'none';
      });
    }

    function renderMultiSelectList(id) {
      const select = document.getElementById(id);
      const trigger = document.getElementById(`${id}-trigger`);
      const box = document.getElementById(`${id}-suggestions`);
      if (!select || !trigger || !box) return;
      const selectedOptions = Array.from(select.selectedOptions);
      const activeOptions = selectedOptions.filter(option => option.value !== 'all');
      trigger.textContent = activeOptions.length
        ? activeOptions.map(option => option.textContent).join(', ')
        : MULTI_SELECT_LABELS[id];

      box.innerHTML = '';
      Array.from(select.options).forEach(option => {
        const item = document.createElement('div');
        item.className = 'suggestion-item' + (option.selected ? ' selected' : '');
        item.textContent = option.textContent;
        item.addEventListener('mousedown', event => {
          event.preventDefault();
          if (option.value === 'all') {
            Array.from(select.options).forEach(opt => { opt.selected = opt.value === 'all'; });
          } else {
            option.selected = !option.selected;
            const allOption = select.querySelector('option[value="all"]');
            if (allOption) allOption.selected = false;
            const anySelected = Array.from(select.options).some(opt => opt.selected && opt.value !== 'all');
            if (!anySelected && allOption) allOption.selected = true;
          }
          renderMultiSelectList(id);
          search();
        });
        box.appendChild(item);
      });
    }

    function setupMultiSelectField(id) {
      const trigger = document.getElementById(`${id}-trigger`);
      const box = document.getElementById(`${id}-suggestions`);
      if (!trigger || !box) return;
      renderMultiSelectList(id);
      trigger.addEventListener('click', event => {
        event.preventDefault();
        const isOpen = box.style.display === 'block';
        closeMultiSelects();
        hideAllFieldSuggestions();
        box.style.display = isOpen ? 'none' : 'block';
      });
      trigger.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        closeMultiSelects();
      });
    }

    function isEditAllowed() {
      const enteredPassword = window.prompt('Passwort für das Bearbeiten eingeben:');
      if (enteredPassword === null) return false;
      if (enteredPassword !== EDIT_PASSWORD) {
        window.alert('Falsches Passwort.');
        return false;
      }
      return true;
    }

    function parseCsv(text) {
      const lines = text.replace(/\r/g,'').split('\n').filter(line => line.trim());
      const header = lines[0].split(';').map(cell => cell.trim());
      const data = lines.slice(1).map(line => {
        const parts = line.split(';');
        const row = {};
        header.forEach((name, index) => row[name] = (parts[index] || '').trim());
        return row;
      });
      return {header, data};
    }

    function uniqueValues(field) {
      const values = new Set();
      rows.forEach(row => {
        const value = (row[field] || '').trim();
        if (value) values.add(value);
      });
      return Array.from(values).sort((a,b) => a.localeCompare(b, 'de'));
    }

    function fillDropdown(id, values) {
      const select = document.getElementById(id);
      if (!select) {
        console.warn(`Dropdown element not found: ${id}`);
        return;
      }
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function padId(id) {
      return String(id).padStart(3, '0');
    }

    function getImageCandidates(id, type = 'original') {
      const rawId = String(id || '').trim();
      if (!rawId) return [];
      const padded = padId(rawId);
      const candidates = [];
      const baseName = `PF-${padded}`;

      if (type === 'preview') {
        // Prefer numbered preview files like PF-003.1_web.webp first.
        for (let index = 1; index <= MAX_IMAGE_VARIANTS; index += 1) {
          IMAGE_EXTENSIONS.forEach(ext => {
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}_web.${ext}`);
          });
        }
        IMAGE_EXTENSIONS.forEach(ext => {
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}_web.${ext}`);
        });
      } else {
        // Match both preview-style _web files and plain image files.
        for (let index = 1; index <= MAX_IMAGE_VARIANTS; index += 1) {
          IMAGE_EXTENSIONS.forEach(ext => {
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}_web.${ext}`);
            candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${index}.${ext}`);
          });
        }
        IMAGE_EXTENSIONS.forEach(ext => {
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}_web.${ext}`);
          candidates.push(`${IMAGE_BASE_PATH}/${baseName}.${ext}`);
        });
      }
      return Array.from(new Set(candidates));
    }

    function loadAllImages(candidates, imageContainer, button, id) {
      imageContainer.innerHTML = '';
      const status = document.createElement('span');
      status.textContent = 'Lädt Originale...';
      status.style.color = '#777';
      imageContainer.appendChild(status);

      let loadedCount = 0;
      let pending = candidates.length;
      if (pending === 0) {
        imageContainer.innerHTML = '';
        const placeholder = document.createElement('span');
        placeholder.textContent = 'keine Originalbilder gefunden';
        placeholder.style.color = '#777';
        imageContainer.appendChild(placeholder);
        return;
      }
      candidates.forEach(src => {
        const img = document.createElement('img');
        img.alt = `Originalbild ${id}`;
        img.loading = 'lazy';
        img.className = 'image-modal-img';
        img.onload = () => {
          if (status.parentNode) imageContainer.removeChild(status);
          loadedCount += 1;
          imageContainer.appendChild(img);
          if (button) {
            button.textContent = 'Originale geladen';
            button.disabled = true;
          }
        };
        img.onerror = () => {
          pending -= 1;
          if (pending === 0 && loadedCount === 0) {
            imageContainer.innerHTML = '';
            const placeholder = document.createElement('span');
            placeholder.textContent = 'keine Originalbilder gefunden';
            placeholder.style.color = '#777';
            imageContainer.appendChild(placeholder);
            if (button) {
              button.textContent = 'Originale anzeigen';
              button.disabled = false;
            }
          }

    function collapseAdminToolbar() {
      const adminToolbar = document.getElementById('adminToolbar');
      if (adminToolbar) adminToolbar.classList.remove('visible');
    }

    function formatBloomRange(row) {
      const activeMonths = MONTH_FIELDS.filter(month => String(row[month] || '').trim() === '1');
      if (!activeMonths.length) return '';
      if (activeMonths.length === 1) return activeMonths[0];
      return `${activeMonths[0]} - ${activeMonths[activeMonths.length - 1]}`;
    }

    function formatColorList(row) {
      const hasColorColumns = COLOR_FIELDS.some(color => Object.prototype.hasOwnProperty.call(row, color));
      if (!hasColorColumns) return row['Blütenfarbe'] || '';
      const activeColors = COLOR_FIELDS.filter(color => String(row[color] || '').trim() === '1');
      return activeColors.join(', ');
    }

    function hasDisplayImages(row) {
      const hasIndexedImages = getImageFilesForId(row?.ID || '').length > 0;
      const hasManualPhotos = Array.isArray(row?.__photos) && row.__photos.some(photo => photo?.src);
      return hasIndexedImages || hasManualPhotos;
    }

    function sortRowsForDisplay(rowsToSort) {
      return [...rowsToSort].sort((a, b) => {
        const aHasImages = hasDisplayImages(a) ? 1 : 0;
        const bHasImages = hasDisplayImages(b) ? 1 : 0;
        if (aHasImages === bHasImages) return 0;
        return aHasImages - bHasImages;
      });
    }

    function renderTable(filtered) {
      const result = document.getElementById('result');
      if (!filtered.length) {
        result.innerHTML = '<p>Keine Treffer gefunden.</p>';
        return;
      }
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const monthStartIndex = fieldNames.findIndex(name => MONTH_FIELDS.includes(name));
      const monthInsertIndex = monthStartIndex >= 0 ? monthStartIndex : fieldNames.length;
      const colorStartIndex = fieldNames.findIndex(name => COLOR_FIELDS.includes(name));
      const visibleFields = fieldNames.filter(name => !MONTH_FIELDS.includes(name) && !COLOR_FIELDS.includes(name));
      const fieldsWithBloomRange = [...visibleFields];
      fieldsWithBloomRange.splice(monthInsertIndex, 0, 'Blütenmonate');
      if (colorStartIndex >= 0 && !fieldsWithBloomRange.includes('Blütenfarbe')) {
        let colorInsertIndex = fieldsWithBloomRange.length;
        for (let i = 0; i < fieldsWithBloomRange.length; i++) {
          const name = fieldsWithBloomRange[i];
          if (name === 'Blütenmonate') continue;
          if (fieldNames.indexOf(name) > colorStartIndex) { colorInsertIndex = i; break; }
        }
        fieldsWithBloomRange.splice(colorInsertIndex, 0, 'Blütenfarbe');
      }
      const displayFields = fieldsWithBloomRange.filter(name => name !== 'ID');

      const headers = ['Bild', ...displayFields];
      headers.forEach(name => {
        const th = document.createElement('th');
        th.textContent = name;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      const displayRows = sortRowsForDisplay(filtered);
      displayRows.forEach(row => {
        const tr = document.createElement('tr');
        tr.appendChild(renderImageCell(row));
        displayFields.forEach(name => {
          const td = document.createElement('td');
          if (name === 'Blütenmonate') {
            td.textContent = formatBloomRange(row);
          } else if (name === 'Blütenfarbe') {
            td.textContent = formatColorList(row);
          } else {
            td.textContent = row[name] || '';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      const wrapper = document.createElement('div');
      wrapper.className = 'table-scroll';
      wrapper.appendChild(table);
      result.innerHTML = '';
      result.appendChild(wrapper);
    }

    function matchesFilter(value, selected) {
      if (Array.isArray(selected)) {
        return selected.includes('all') || selected.length === 0 || selected.includes(String(value || '').trim());
      }
      if (selected === 'all') return true;
      return String(value || '').trim() === selected;
    }

    function resetFilters() {
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
        const input = document.getElementById(id);
        if (input) input.value = '';
      });
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        select.querySelectorAll('option').forEach(option => {
          option.selected = option.value === 'all';
        });
      });
      const monthSelect = document.getElementById('field-month');
      if (monthSelect) {
        monthSelect.querySelectorAll('option').forEach(option => {
          option.selected = option.value === 'all';
        });
      }
      const colorSelect = document.getElementById('field-color');
      if (colorSelect) {
        colorSelect.querySelectorAll('option').forEach(option => {
          option.selected = option.value === 'all';
        });
      }
      renderMultiSelectList('field-month');
      renderMultiSelectList('field-color');
      closeMultiSelects();
      hideAllFieldSuggestions();
      document.getElementById('status').textContent = `Daten geladen: ${rows.length} Zeile(n)`;
      renderTable(rows);
    }

    function search() {
      const monthSelect = document.getElementById('field-month');
      const selectedMonths = monthSelect ? Array.from(monthSelect.selectedOptions).map(option => option.value) : ['all'];
      const months = selectedMonths.includes('all') || selectedMonths.length === 0 ? ['all'] : selectedMonths;
      const colorSelect = document.getElementById('field-color');
      const selectedColors = colorSelect ? Array.from(colorSelect.selectedOptions).map(option => option.value) : ['all'];
      const colors = selectedColors.includes('all') || selectedColors.length === 0 ? ['all'] : selectedColors;
      const textFilters = {};
      Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
        textFilters[AUTOCOMPLETE_FIELD_MAP[id]] = String(document.getElementById(id)?.value || '').trim().toLowerCase();
      });
      const selectFilters = {};
      Object.keys(SELECT_FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        selectFilters[SELECT_FIELD_MAP[id]] = select.multiple
          ? Array.from(select.selectedOptions).map(option => option.value)
          : select.value;
      });

      const filtered = rows.filter(row => {
        for (const [field, selectedText] of Object.entries(textFilters)) {
          if (!selectedText) continue;
          const value = String(row[field] || '').toLowerCase();
          if (!startsWithWord(value, selectedText)) return false;
        }
        for (const [field, selected] of Object.entries(selectFilters)) {
          if (!matchesFilter(row[field], selected)) return false;
        }
        if (months[0] !== 'all') {
          if (!months.some(month => String(row[month] || '').trim() === '1')) return false;
        }
        if (colors[0] !== 'all') {
          if (!colors.some(color => String(row[color] || '').trim() === '1')) return false;
        }
        return true;
      });

      document.getElementById('status').textContent = `${filtered.length} Ergebnis(se)`;
      renderTable(filtered);
    }

    async function init() {
      const status = document.getElementById('status');
      try {
        const response = await fetch(CSV_FILE);
        if (!response.ok) throw new Error('CSV-Datei konnte nicht geladen werden.');
        const text = await response.text();
        const parsed = parseCsv(text);
        fieldNames = parsed.header.filter(name => name && name !== 'Notizen');
        baseRows = parsed.data;
        manualPlants = loadManualPlants();
        deletedPlantIds = loadDeletedPlantIds();
        refreshRows();

        try {
          const imageResponse = await fetch(IMAGE_INDEX_FILE);
          if (imageResponse.ok) {
            imageIndex = await imageResponse.json();
          } else {
            console.warn(`Bildindex konnte nicht geladen werden: ${imageResponse.status}`);
          }
        } catch (error) {
          console.warn('Bildindex konnte nicht geladen werden:', error);
        }

        status.textContent = `Daten geladen: ${rows.length} Zeile(n)`;

        refreshFilterOptions();

        Object.keys(AUTOCOMPLETE_FIELD_MAP).forEach(id => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener('input', event => {
            search();
            renderFieldSuggestions(id, event.target.value || '', false);
          });
          input.addEventListener('focus', () => {
            hideAllFieldSuggestions();
            renderFieldSuggestions(id, '', true);
          });
        });

        setupMultiSelectField('field-month');
        setupMultiSelectField('field-color');

        document.addEventListener('click', event => {
          const insideAutocomplete = event.target.closest('.autocomplete-wrapper');
          const insideMultiSelect = event.target.closest('.filter-select-field');
          if (!insideMultiSelect) closeMultiSelects();
          if (!insideAutocomplete) hideAllFieldSuggestions();
        });

        document.getElementById('resetButton').addEventListener('click', event => {
          event.preventDefault();
          resetFilters();
        });
        document.getElementById('addPlantButton').addEventListener('click', event => {
          event.preventDefault();
          if (!isEditAllowed()) return;
          openPlantForm();
        });
        document.getElementById('editPlantButton').addEventListener('click', event => {
          event.preventDefault();
          if (!isEditAllowed()) return;
          openEditDialog();
        });
        document.getElementById('deletePlantButtonMain').addEventListener('click', event => {
          event.preventDefault();
          if (!isEditAllowed()) return;
          openDeleteDialog();
        });
        document.getElementById('adminEditToggle').addEventListener('click', event => {
          event.preventDefault();
          document.getElementById('adminToolbar').classList.toggle('visible');
        });
        renderTable(rows);
      } catch (error) {
        status.innerHTML = '<span class="error">Fehler: ' + error.message + '</span>';
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
