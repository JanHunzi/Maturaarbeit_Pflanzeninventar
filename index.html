<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflanzeninventar Suche</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1rem; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 0.5rem; }
    .toolbar { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 1rem; }
    .toolbar label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .autocomplete-wrapper { position: relative; }
    .suggestions { position: absolute; top: calc(100% + 0.25rem); left: 0; right: 0; background: #fff; border: 1px solid #bbb; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-height: 240px; overflow-y: auto; z-index: 10; display: none; }
    .suggestion-item { padding: 0.5rem 0.7rem; cursor: pointer; }
    .suggestion-item:hover { background: #f4f7fb; }
    .image-cell { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .image-cell img { max-width: 180px; max-height: 140px; width: auto; height: auto; object-fit: contain; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    select, input[type=text], button { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid #bbb; border-radius: 5px; box-sizing: border-box; }
    button { cursor: pointer; background: #2a7ae2; color: #fff; border: none; transition: background 0.2s ease; }
    button:hover { background: #1c61c3; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.55rem; text-align: left; }
    th { background: #f4f4f4; }
    .footer { margin-top: 1rem; color: #555; }
    .spinner { display: inline-block; margin-left: 0.5rem; }
    .error { color: #b00; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pflanzeninventar</h1>

      <div class="toolbar">
        <div>
          <label for="query">Freitext</label>
          <div class="autocomplete-wrapper">
            <input id="query" type="text" placeholder="z. B. Wasser, Salvia, gelb" autocomplete="off" />
            <div id="querySuggestions" class="suggestions"></div>
          </div>
        </div>
        <div>
          <label for="field-name-de">Name Deutsch</label>
          <select id="field-name-de"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-name-latin">Name Latein</label>
          <select id="field-name-latin"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-family">Pflanzenfamilie</label>
          <select id="field-family"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-growth">Wuchsform</label>
          <select id="field-growth"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-color">Blütenfarbe</label>
          <select id="field-color"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-planted">Gepflanzt</label>
          <select id="field-planted"><option value="all">Alle</option></select>
        </div>
        <div>
          <label for="field-month">Monat(e)</label>
          <select id="field-month" multiple size="5">
            <option value="all">Alle Monate</option>
            <option>Jan</option>
            <option>Feb</option>
            <option>Mar</option>
            <option>Apr</option>
            <option>Mai</option>
            <option>Jun</option>
            <option>Jul</option>
            <option>Aug</option>
            <option>Sep</option>
            <option>Okt</option>
            <option>Nov</option>
            <option>Dez</option>
          </select>
        </div>
      </div>

    <button id="resetButton">Zurücksetzen</button>
    <div class="footer" id="status">Lade Daten...</div>

    <div id="result"></div>
  </div>

  <script>
    const CSV_FILE = 'Pflanzenliste_Maturaarbeit_DBV2.0_cvs.csv';
    const FIELD_MAP = {
      'field-name-de': 'Name Deutsch',
      'field-name-latin': 'Name Latein',
      'field-family': 'Pflanzenfamilie',
      'field-growth': 'Wuchsform',
      'field-color': 'Blütenfarbe',
      'field-planted': 'Gepflanzt'
    };
    const MONTH_FIELDS = ['Jan','Feb','Mar','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const IMAGE_BASE_PATH = 'Images';
    const IMAGE_EXTENSIONS = ['jpg','jpeg','png','JPG','JPEG','PNG'];
    const MAX_IMAGE_VARIANTS = 4;
    let rows = [];
    let fieldNames = [];
    let suggestionValues = [];

    function parseCsv(text) {
      const lines = text.replace(/\r/g,'').split('\n').filter(line => line.trim());
      const header = lines[0].split(';').map(cell => cell.trim());
      const data = lines.slice(1).map(line => {
        const parts = line.split(';');
        const row = {};
        header.forEach((name, index) => row[name] = (parts[index] || '').trim());
        return row;
      });
      return {header, data};
    }

    function uniqueValues(field) {
      const values = new Set();
      rows.forEach(row => {
        const value = (row[field] || '').trim();
        if (value) values.add(value);
      });
      return Array.from(values).sort((a,b) => a.localeCompare(b, 'de'));
    }

    function fillDropdown(id, values) {
      const select = document.getElementById(id);
      if (!select) {
        console.warn(`Dropdown element not found: ${id}`);
        return;
      }
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function renderQuerySuggestions(query) {
      const box = document.getElementById('querySuggestions');
      if (!box) return;
      const normalized = query.trim().toLowerCase();
      if (!normalized) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      const matches = suggestionValues.filter(value => value.toLowerCase().includes(normalized)).slice(0, 8);
      if (!matches.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      box.innerHTML = matches.map(value => `<div class="suggestion-item">${value}</div>`).join('');
      box.style.display = 'block';
      box.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('mousedown', event => {
          event.preventDefault();
          const value = item.textContent;
          document.getElementById('query').value = value;
          box.style.display = 'none';
          search();
        });
      });
    }

    function hideQuerySuggestions() {
      const box = document.getElementById('querySuggestions');
      if (box) {
        box.style.display = 'none';
      }
    }

    function padId(id) {
      return String(id).padStart(3, '0');
    }

    function getImageCandidates(id) {
      const rawId = String(id || '').trim();
      if (!rawId) return [];
      const padded = padId(rawId);
      const prefixes = [
        `PF-${padded}`,
        `PF${padded}`,
        `PF-${rawId}`,
        `PF${rawId}`,
        padded,
        rawId
      ];
      const candidates = [];
      prefixes.forEach(prefix => {
        IMAGE_EXTENSIONS.forEach(ext => candidates.push(`${IMAGE_BASE_PATH}/${prefix}.${ext}`));
        for (let index = 1; index <= MAX_IMAGE_VARIANTS; index += 1) {
          IMAGE_EXTENSIONS.forEach(ext => candidates.push(`${IMAGE_BASE_PATH}/${prefix}.${index}.${ext}`));
        }
      });
      const uppercaseCandidates = candidates.map(candidate => candidate.replace(/\.(jpg|jpeg|png)$/i, match => match.toUpperCase()));
      return Array.from(new Set([...candidates, ...uppercaseCandidates]));
      return Array.from(new Set(candidates));
    }

    function renderImageCell(id) {
      const cell = document.createElement('td');
      const wrapper = document.createElement('div');
      wrapper.className = 'image-cell';
      const placeholder = document.createElement('span');
      placeholder.textContent = 'kein Bild';
      placeholder.style.color = '#777';
      wrapper.appendChild(placeholder);

      if (!id) {
        cell.appendChild(wrapper);
        return cell;
      }

      const candidates = getImageCandidates(id);
      candidates.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = `Pflanzenbild ${id}`;
        img.onload = () => {
          if (placeholder.parentNode) {
            placeholder.remove();
          }
        };
        img.onerror = () => {
          img.remove();
          if (!wrapper.querySelector('img') && !wrapper.contains(placeholder)) {
            wrapper.appendChild(placeholder);
          }
        };
        wrapper.appendChild(img);
      });

      cell.appendChild(wrapper);
      return cell;
    }

    function renderTable(filtered) {
      const result = document.getElementById('result');
      if (!filtered.length) {
        result.innerHTML = '<p>Keine Treffer gefunden.</p>';
        return;
      }
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const headers = ['Bild', ...fieldNames];
      headers.forEach(name => {
        const th = document.createElement('th');
        th.textContent = name;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      filtered.forEach(row => {
        const tr = document.createElement('tr');
        tr.appendChild(renderImageCell(row.ID));
        fieldNames.forEach(name => {
          const td = document.createElement('td');
          td.textContent = row[name] || '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      result.innerHTML = '';
      result.appendChild(table);
    }

    function matchesFilter(value, selected) {
      if (selected === 'all') return true;
      return String(value || '').trim() === selected;
    }

    function resetFilters() {
      document.getElementById('query').value = '';
      const monthSelect = document.getElementById('field-month');
      monthSelect.querySelectorAll('option').forEach(option => {
        option.selected = option.value === 'all';
      });
      Object.keys(FIELD_MAP).forEach(id => {
        const select = document.getElementById(id);
        if (select) select.value = 'all';
      });
      document.getElementById('status').textContent = `Daten geladen: ${rows.length} Zeile(n)`;
      renderTable(rows);
    }

    function search() {
      const query = document.getElementById('query').value.trim().toLowerCase();
      const monthSelect = document.getElementById('field-month');
      const selectedMonths = Array.from(monthSelect.selectedOptions).map(option => option.value);
      const months = selectedMonths.includes('all') || selectedMonths.length === 0 ? ['all'] : selectedMonths;
      const filters = {};
      Object.keys(FIELD_MAP).forEach(id => {
        filters[FIELD_MAP[id]] = document.getElementById(id).value;
      });

      const filtered = rows.filter(row => {
        if (query) {
          const text = Object.values(row).join(' ').toLowerCase();
          if (!text.includes(query)) return false;
        }
        for (const [field, selected] of Object.entries(filters)) {
          if (!matchesFilter(row[field], selected)) return false;
        }
        if (months[0] !== 'all') {
          if (!months.some(month => String(row[month] || '').trim() === '1')) return false;
        }
        return true;
      });

      document.getElementById('status').textContent = `${filtered.length} Ergebnis(se)`;
      renderTable(filtered);
    }

    async function init() {
      const status = document.getElementById('status');
      try {
        const response = await fetch(CSV_FILE);
        if (!response.ok) throw new Error('CSV-Datei konnte nicht geladen werden.');
        const text = await response.text();
        const parsed = parseCsv(text);
        fieldNames = parsed.header;
        rows = parsed.data;
        status.textContent = `Daten geladen: ${rows.length} Zeile(n)`;

        Object.keys(FIELD_MAP).forEach(id => fillDropdown(id, uniqueValues(FIELD_MAP[id])));
        const suggestionSet = new Set();
        rows.forEach(row => {
          Object.values(row).forEach(value => {
            if (value) suggestionSet.add(value.trim());
          });
        });
        suggestionValues = Array.from(suggestionSet).sort((a, b) => a.localeCompare(b, 'de'));

        const queryInput = document.getElementById('query');
        if (queryInput) {
          queryInput.addEventListener('input', event => {
            search();
            renderQuerySuggestions(event.target.value || '');
          });
          queryInput.addEventListener('focus', event => {
            renderQuerySuggestions(event.target.value || '');
          });
        }

        const searchInputs = ['field-name-de', 'field-name-latin', 'field-family', 'field-growth', 'field-color', 'field-planted'];
        searchInputs.forEach(id => {
          const element = document.getElementById(id);
          if (!element) return;
          element.addEventListener('input', search);
          element.addEventListener('change', search);
        });
        const monthSelect = document.getElementById('field-month');
        if (monthSelect) {
          monthSelect.addEventListener('mousedown', event => {
            if (event.target.tagName !== 'OPTION') return;
            event.preventDefault();
            const option = event.target;
            if (option.value === 'all') {
              Array.from(monthSelect.options).forEach(opt => {
                opt.selected = opt.value === 'all';
              });
            } else {
              option.selected = !option.selected;
              const allOption = monthSelect.querySelector('option[value="all"]');
              if (allOption) allOption.selected = false;
              const anyMonthSelected = Array.from(monthSelect.options).some(opt => opt.selected && opt.value !== 'all');
              if (!anyMonthSelected && allOption) {
                allOption.selected = true;
              }
            }
            search();
          });
        }

        document.addEventListener('click', event => {
          const wrapper = document.querySelector('.autocomplete-wrapper');
          if (!wrapper || wrapper.contains(event.target)) return;
          hideQuerySuggestions();
        });

        document.getElementById('resetButton').addEventListener('click', event => {
          event.preventDefault();
          resetFilters();
        });
        renderTable(rows);
      } catch (error) {
        status.innerHTML = '<span class="error">Fehler: ' + error.message + '</span>';
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
